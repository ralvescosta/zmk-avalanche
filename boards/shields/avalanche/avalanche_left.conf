# Uncomment to enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Central (left side) Bluetooth connection and buffer settings
# These settings should ONLY be on the central side

# BT connection limits for split + BT profiles
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Bluetooth Controller Buffer Configuration
# Increase TX buffers to prevent dropped packets during split communication
CONFIG_BT_CTLR_TX_BUF_COUNT=5
# Increase L2CAP TX buffer count for better throughput  
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# Split Keyboard BLE Configuration (Central side)
# Queue size for key position events received FROM peripherals
# Default is 5, increasing to 20 for better reliability after wake
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20

# BLE Connection Interval - Lower = faster response, higher battery drain
# Set preferred connection interval to 7.5ms (6 BLE units × 1.25ms = 7.5ms)
# Default is 6 which is already optimal
# BLE units: multiply by 1.25ms to get actual interval in milliseconds
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6

