# Uncomment to enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Avalanche OLED Display
CONFIG_ZMK_DISPLAY=y
# To use nice_oled this must be disabled
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
# To use nice_oled this must be disabled
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
# To use nice_oled this must be disabled
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_NICE_VIEW_WIDGET_STATUS=y
# To use nice_oled this must be disabled
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_HID_INDICATORS=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Nice Oled configurations
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_LAYER_STATUS=y
CONFIG_NICE_OLED_WIDGET_BATTERY_STATUS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_LOGO=y
CONFIG_NICE_OLED_GEM_ANIMATION=n

# beuter blu2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y


# unklocking zmk-studio
CONFIG_ZMK_STUDIO_LOCKING=n
