# Uncomment to enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Avalanche OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# System configuration
CONFIG_ZMK_SPLIT=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Power Management - Idle and Sleep Configuration
# Keyboard enters idle state after 30 seconds (display/RGB off, BT stays connected)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep mode for battery savings
CONFIG_ZMK_SLEEP=y
# Enter deep sleep after 15 minutes of inactivity (900000ms)
# Adjust this value based on your usage pattern
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth Controller Buffer Configuration
# Increase TX buffers to prevent dropped packets during split communication
CONFIG_BT_CTLR_TX_BUF_COUNT=5
# Increase L2CAP TX buffer count for better throughput
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# Split Keyboard BLE Configuration
# Increase peripheral position queue size to buffer more key events
# Default is 10, increasing to 20 for better reliability after wake
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=20

# BLE Connection Interval - Lower = faster response, higher battery drain
# Set preferred connection interval to 7.5ms (7500 microseconds) for better responsiveness
# Default is often 30ms which can cause the observed delay after wake
CONFIG_ZMK_SPLIT_BLE_PREF_INT=7500

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300


